name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Check formatting
        run: swift format lint --strict --recursive Sources Tests Package.swift scripts/*.swift
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build app bundle (ad hoc signed)
        run: bash scripts/build-app.sh
